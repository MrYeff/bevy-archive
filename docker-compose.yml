services:
  postgres:
    image: postgres:16
    container_name: article_pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: article_redis
    ports:
      - "6379:6379"

  endpoints:
    build:
      context: ./code
      dockerfile: services/endpoints/Dockerfile
    container_name: article_endpoints
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      ENDPOINT_PORT: 8080

      # PgAccesArgs
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DBNAME: app
      PG_USER: app
      PG_PASSWORD: app

      # RedisAccessArgs
      # RedisDesignation::RenderWorkerCache -> "RenderWorkerCache"
      REDIS_RENDERWORKERCACHE_HOST: redis
      REDIS_RENDERWORKERCACHE_PORT: 6379
      REDIS_RENDERWORKERCACHE_BASE_KEY: "render:"

      # RedisDesignation::PreloadArticleWorkerCache -> "PreloadArticleWorkerCache"
      REDIS_PRELOADARTICLEWORKERCACHE_HOST: redis
      REDIS_PRELOADARTICLEWORKERCACHE_PORT: 6379
      REDIS_PRELOADARTICLEWORKERCACHE_BASE_KEY: "preload:"

  article-meta-import-worker:
    build:
      context: ./code
      dockerfile: services/workers/article-meta-import-worker/Dockerfile
    container_name: article_meta_import_worker
    depends_on:
      - redis
    environment:
      REDIS_PRELOADARTICLEWORKERCACHE_HOST: redis
      REDIS_PRELOADARTICLEWORKERCACHE_PORT: 6379
      REDIS_PRELOADARTICLEWORKERCACHE_BASE_KEY: "preload:"

volumes:
  pgdata:
