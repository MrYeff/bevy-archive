{% match result %}

{% when Result::Err(err) %}
<div class="error">Error loading metadata: {{ err }}</div>
{% when Result::Ok(meta) %}
<div class="preview">
    <h2>{{ meta.title }}</h2>
    <p>
        Tags:
        {% for tag in meta.tags %}<span>{{ tag }} |</span>{% endfor %}
    </p>
    <button hx-post="/article/new/register?url={{ url }}" hx-swap="outerHTML">register</button>
</div>
{% endmatch %}
