[workspace]
resolver = "3"
members = ["services/workers/*", "services/endpoints/*", "libs/*"]

[workspace.dependencies]
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }

axum = { version = "0.8.6", features = ["macros"] }
reqwest = "0.12.24"

fred = "10.1.0"
sqlx = "0.8.6"

serde = "1.0.228"
serde_json = "1.0.145"
serde_toml = "0.0.1"

askama = "0.14.0"
comrak = "0.47.0"

derive_more = { version = "2.0.1", features = ["display"] }
clap = { version = "4.5.51", features = ["derive", "env", "string"] }
thiserror = "2.0.17"
anyhow = "1.0.100"

# libs

shared = { path = "libs/shared" }
redis = { path = "libs/redis" }
