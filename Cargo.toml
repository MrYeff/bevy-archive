[workspace]
resolver = "3"
members = [ "constants",
    "endpoints/main", "redis",
    "shared",
    "workers/article-meta-import-worker",
    "workers/article-render-worker",
]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = { version = "0.8.6", features = ["macros"] }

reqwest = "0.12.24"

fred = "10.1.0"
sqlx = "0.8.6"

serde = "1.0.228"
serde_json = "1.0.145"
serde_toml = "0.0.1"

askama = "0.14.0"

comrak = "0.47.0"

derive_more = { version = "2.0.1", features = ["display"] }
futures = "0.3.31"
